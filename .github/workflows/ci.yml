name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本来自 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # 门禁四段（= 本地同一套，清单唯一出处 docs/testing.md「门禁」）
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
